<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Không tìm thấy trang – Sân Bóng Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: max(1.25rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.25rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC radial-gradient(#E2E8F0 1px, transparent 1px) 0 0 / 1.5rem 1.5rem;
      color: #0F172A; line-height: 1.5;
    }
    .card {
      width: 100%; max-width: 30rem; background: #FFFFFF;
      border: 1px solid #E2E8F0; border-top: 4px solid #16A34A; border-radius: 1rem;
      padding: 2rem 1.25rem; box-shadow: 0 12px 32px -12px rgba(15, 23, 42, 0.12); text-align: center;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0.875rem;
      border-radius: 999px; background: #F8FAFC; border: 1px solid #E2E8F0;
      color: #0F172A; font-size: 0.8125rem; font-weight: 700;
    }
    .icon-box {
      width: 3.25rem; height: 3.25rem; margin: 1.25rem auto 0.5rem; border-radius: 0.875rem;
      background: #F8FAFC; border: 1px solid #E2E8F0; display: grid; place-items: center; color: #16A34A;
    }
    .code { margin: 0 0 0.5rem; font-size: clamp(3.25rem, 12vw, 4.5rem); font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: #15803D; }
    h1 { margin: 0 0 0.75rem; font-size: clamp(1.375rem, 4.5vw, 1.75rem); font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
    .desc { margin: 0 0 1.75rem; font-size: 0.9375rem; line-height: 1.6; color: #475569; overflow-wrap: anywhere; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 44px;
      padding: 0.75rem 1.25rem; border-radius: 0.625rem; font-size: 0.9375rem; font-weight: 600;
      text-decoration: none; border: 1px solid transparent; transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary { background: #15803D; border-color: #15803D; color: #FFFFFF; }
    .btn-primary:hover { background: #0F172A; border-color: #0F172A; }
    .btn-secondary { background: #FFFFFF; border-color: #E2E8F0; color: #0F172A; }
    .btn-secondary:hover { background: #F8FAFC; border-color: #475569; }
    .btn:focus-visible { outline: 3px solid #15803D; outline-offset: 2px; }
    @media (min-width: 480px) {
      .card { padding: 2.5rem 2.25rem; }
      .actions { flex-direction: row; justify-content: center; }
      .btn { width: auto; min-width: 10.5rem; }
    }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7l3 2.2-1.1 3.6h-3.8L9 9.2 12 7z"/></svg><span>Sân Bóng Pro</span></div>
    <div class="icon-box" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8.5 8.5l5 5m0-5-5 5"/></svg></div>
    <p class="code">404</p>
    <h1>Không tìm thấy trang</h1>
    <p class="desc">Đường dẫn bạn truy cập không tồn tại hoặc đã được thay đổi. Vui lòng quay về trang chủ hoặc xem danh sách sân đang mở đặt lịch.</p>
    <div class="actions"><a class="btn btn-primary" href="/">Quay về trang chủ</a><a class="btn btn-secondary" href="/fields">Xem danh sách sân</a></div>
  </main>
</body>
</html>
